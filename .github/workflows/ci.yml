name: macOS
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Swift tests
        run: swift test
      - name: Build native app
        run: ./scripts/build-app.sh
      - name: Verify bundle signature
        run: codesign --verify --deep --strict dist/Branchlet.app
